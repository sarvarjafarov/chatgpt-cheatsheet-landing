# Static site for the ChatGPT Cheat Sheet landing page.
# Serves index.html and og-image.png only. Put TLS in front of this (or add a listen 443 block).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only the public files are served; everything else returns 404.
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache" always; include /etc/nginx/conf.d/security-headers.inc; }
    location = /index.html { add_header Cache-Control "no-cache" always; include /etc/nginx/conf.d/security-headers.inc; }
    location = /abune { try_files /abune.html =404; add_header Cache-Control "no-store" always; include /etc/nginx/conf.d/security-headers.inc; }
    location = /abune.html { add_header Cache-Control "no-store" always; include /etc/nginx/conf.d/security-headers.inc; }
    location = /og-image.png { add_header Cache-Control "public, max-age=604800" always; }
    location / { return 404; }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
